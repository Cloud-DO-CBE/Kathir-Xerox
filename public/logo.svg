<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@700;900&amp;family=Outfit:wght@700;800&amp;display=swap');
      .tamil-title {
        font-family: 'Noto Serif Tamil', 'Latha', 'Tamil Sangam MN', serif;
        font-weight: 900;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .tamil-sub {
        font-family: 'Noto Serif Tamil', 'Latha', 'Tamil Sangam MN', serif;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .esevai-title {
        font-family: 'Noto Serif Tamil', 'Outfit', sans-serif, serif;
        font-weight: 800;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .maiyam-sub {
        font-family: 'Outfit', 'Courier New', serif;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Top Half: Solid Black -->
  <rect x="0" y="0" width="400" height="200" fill="#000000" />

  <!-- "கதிர்" (Kathir) -->
  <text x="200" y="90" font-size="96" class="tamil-title">கதிர்</text>
  
  <!-- "ஜெராக்ஸ்" (Xerox) -->
  <text x="200" y="160" font-size="38" class="tamil-sub">ஜெராக்ஸ்</text>

  <!-- Bottom Half: Vibrant Turquoise / Cyan -->
  <rect x="0" y="200" width="400" height="200" fill="#46D8E7" />

  <!-- "e - சேவை" (e - Sevai) -->
  <text x="200" y="275" font-size="64" class="esevai-title">e - சேவை</text>

  <!-- "MAIYAM" -->
  <text x="200" y="348" font-size="52" class="maiyam-sub">MAIYAM</text>
</svg>
